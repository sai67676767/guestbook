version: '3.8'

services:
  # --- База данных PostgreSQL ---
  db:
    image: postgres:15-alpine
    container_name: guestbook_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guestbook_network
    # Порты наружу НЕ пробрасываем — доступ только внутри docker-сети

  # --- Бэкенд на FastAPI ---
  backend:
    build: ./backend
    container_name: guestbook_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - guestbook_network
    # Порт наружу не нужен, nginx будет проксировать запросы

  # --- Nginx (reverse proxy + статика) ---
  nginx:
    image: nginx:alpine
    container_name: guestbook_nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # Чтобы не конфликтовать с первым проектом, используем 8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - guestbook_network

# --- Общая сеть для всех контейнеров ---
networks:
  guestbook_network:
    driver: bridge

# --- Постоянное хранилище для данных БД ---
volumes:
  postgres_data:
